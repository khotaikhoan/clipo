<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài đăng</title>
<style>
body { margin:0; font: 17px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; background:#fff; color:#111; }
.post { padding: 8px 18px 4px; }
.head { display:flex; align-items:center; gap:12px; }
.avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ff9a8b,#ff6a88); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
.name { font-weight:700; }
.time { color:#8e8e93; font-size:14px; }
.text { margin:10px 0 8px; font-size:18px; }
.stats { color:#8e8e93; font-size:15px; display:flex; gap:18px; padding:4px 0 10px; }
.comment { display:flex; gap:10px; padding:14px 18px; }
.comment .avatar { width:34px; height:34px; font-size:14px; background:linear-gradient(135deg,#84fab0,#8fd3f4); }
.bubble { background:#f2f2f7; border-radius:16px; padding:8px 12px; font-size:16px; }
.bubble b { display:block; font-size:14px; }
.box { padding: 2px 14px 12px; border-bottom:1px solid #eee; }
.box textarea { width:100%; box-sizing:border-box; font: 17px/1.4 -apple-system, sans-serif; padding:11px 16px; border-radius:20px; border:1px solid #ddd; background:#f7f7f9; outline:none; resize:none; height:72px; }
</style>
</head>
<body>
<div class="post">
  <div class="head"><div class="avatar">MA</div><div><div class="name">Minh Anh</div><div class="time">2 giờ</div></div></div>
  <div class="text">Cuối tuần này mình quyết định nghỉ ngơi hẳn, không đụng vào công việc. Mọi người thường làm gì để nạp lại năng lượng? 🌿</div>
  <div class="stats"><span>❤️ 128</span><span>💬 24</span><span>↗︎ 6</span></div>
</div>
<div class="box"><textarea rows="2" placeholder="Viết bình luận…"></textarea></div>
<div class="comment"><div class="avatar">TL</div><div class="bubble"><b>Thu Lan</b>Đi biển liền cho mình! 🏖️</div></div>
</body>
</html>
